version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: routeflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - routeflow-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routeflow-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/routeflow
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-key-must-be-at-least-32-bytes-long}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    volumes:
      - routeflow-uploads:/app/uploads

  # Optional: self-hosted OSRM for reliable routing (needs a regional .osm.pbf extract from Geofabrik).
  # Uncomment and follow the OSRM docker quickstart once you download an extract into ./osrm-data.
  # osrm:
  #   image: osrm/osrm-backend
  #   container_name: routeflow-osrm
  #   volumes:
  #     - ./osrm-data:/data
  #   ports:
  #     - "5000:5000"
  #   command: osrm-routed --algorithm mld /data/region.osrm

volumes:
  routeflow-mongo-data:
  routeflow-uploads:
