server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: routeflow-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/routeflow}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

routeflow:
  # Operating timezone: decides what "today" is and how shift times (09:00) map to instants.
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}

  jwt:
    # IMPORTANT: override in production via env var JWT_SECRET (min 256-bit / 32+ char random string)
    secret: ${JWT_SECRET:change-this-dev-only-secret-key-must-be-at-least-32-bytes-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}
    refresh-token-ttl-minutes: ${JWT_REFRESH_TTL_MIN:1440}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

  geocoding:
    # Nominatim (OpenStreetMap) - free, respect usage policy (max ~1 req/sec, set a real User-Agent)
    provider: nominatim
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
      user-agent: "${NOMINATIM_USER_AGENT:RouteFlow/0.1 (contact: your-email@example.com)}"

  routing:
    # OSRM (Open Source Routing Machine) - free public demo server has fair-use limits.
    # Self-host via docker-compose (see docker-compose.yml, service "osrm") for reliability.
    osrm:
      base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
      profile: ${OSRM_PROFILE:driving}
    # Fallback average speed (km/h) used for ETA calc when a routing engine call fails.
    fallback-avg-speed-kmh: ${FALLBACK_AVG_SPEED_KMH:30}

  storage:
    # local disk storage for proof-of-delivery photos/signatures (free, no cloud dependency)
    upload-dir: ${UPLOAD_DIR:./uploads}

  simulator:
    enabled: ${DRIVER_SIMULATOR_ENABLED:true}
    tick-ms: ${DRIVER_SIMULATOR_TICK_MS:3000}
    # Virtual-time multiplier so a demo route finishes in minutes, not hours (real speed is reported unchanged).
    speed-multiplier: ${DRIVER_SIMULATOR_SPEED_MULTIPLIER:8}
    # Ticks a simulated driver "dwells" at a stop (ARRIVED) before auto-delivering - gives you time to click Deliver + capture POD.
    dwell-ticks: ${DRIVER_SIMULATOR_DWELL_TICKS:10}
    # A vehicle that sent a real GPS ping this recently is driven by the real device, not the simulator.
    real-driver-timeout-seconds: ${DRIVER_SIMULATOR_REAL_TIMEOUT_S:20}

  seed:
    enabled: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.routeflow: INFO
